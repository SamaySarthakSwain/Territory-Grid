name: Territory Grid CI & Auto-Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  web-and-system-audit:
    name: 🛡️ Web, DOM & System Health Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: 1. Deep DOM & Script Syntax Validation
        run: node scripts/deep_dom_validator.js

      - name: 2. Core Portals & Elements Validation
        run: node scripts/verify_all_portals.js

      - name: 3. Asset Synchronization & Parity Check
        run: node scripts/auto_heal.js

      - name: 4. Full 65-Point System Health Audit
        run: node scripts/system_health_audit.js --local

  android-build-check:
    name: 📱 Android APK Build & Asset Integrity
    runs-on: ubuntu-latest
    needs: web-and-system-audit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify Android Gradle Compilation
        run: ./gradlew assembleDebug --stacktrace
